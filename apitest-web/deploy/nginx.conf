# apitest-web 生产反向代理（同源转发）
#
# 前端内部转发方案：浏览器只连页面来源，SPA 的 /api/v1/* 请求与 Mock/MCP/SDK/Runner
# 的根路径端点都由本层反代到后端，避免跨源、不依赖后端 CORS。开发环境由 Vite dev server
# 的 proxy 承担同一职责（见 apitest-web/vite.config.ts），生产由本文件承担。
#
# 用法：
#   1. 把 `vite build` 产物（dist/）放到 root 指向的目录。
#   2. 把 proxy_pass 的 127.0.0.1:3000 换成实际后端地址（后端 API 进程默认 3000）。
#   3. 生产同源部署时不要设 VITE_API_BASE_URL：SPA 发相对 /api/v1，由本层转发。
#   4. server_name / 证书按实际域名填。

upstream apitest_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name apitest.example.com;

    # TLS：换成实际证书路径
    ssl_certificate     /etc/ssl/certs/apitest.crt;
    ssl_certificate_key /etc/ssl/private/apitest.key;

    # 前端静态资源（vite build 产物）
    root /var/www/apitest-web/dist;
    index index.html;

    # 上传体：导入用例 / 附件等留足余量
    client_max_body_size 32m;

    # SSE 长连接：执行流 / 助手对话流。必须放在通用 /api/ 之前，关缓冲、拉长超时。
    location ^~ /api/v1/projects/ {
        proxy_pass http://apitest_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # SPA 自己的 API 请求：同源转发到后端
    location /api/ {
        proxy_pass http://apitest_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # 外部可直接调用的根路径端点（不带 /api/v1 前缀）：
    #   /mock/:publicId/*  Mock 回放
    #   /mcp               MCP 端点
    #   /ingest            SDK 上报
    location ~ ^/(mock|mcp|ingest)(/|$) {
        proxy_pass http://apitest_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # 带 hash 的构建资源：长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 路由回退：其余路径交给前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 可选：80 -> 443 跳转
server {
    listen 80;
    server_name apitest.example.com;
    return 301 https://$host$request_uri;
}
