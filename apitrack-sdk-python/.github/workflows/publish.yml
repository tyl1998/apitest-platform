name: publish

# PyPI 发布走 Trusted Publishing（OIDC），**不在 CI 里存长期 API Token**（计划 7.4）：
# 长期 token 泄露等于任何人都能往这个包名发一个版本，而它会被自动装进所有接入方的 CI。
#
# 两条路径，靠触发方式区分：
#
# | 触发             | 版本号                       | 上传目标        | 用途           |
# |------------------|------------------------------|-----------------|----------------|
# | 手动 Run workflow | `<主包版本>.dev<epoch 秒>`   | 只 TestPyPI     | 想跑几次跑几次 |
# | 打 tag `v0.1.0`  | `0.1.0`                      | TestPyPI → PyPI | 真发布         |
#
# **调试路径必须每次带一个新版本号**，这是整个设计的关键：TestPyPI 与 PyPI 一样版本号
# 不可重用，如果调试时改了代码却复用 `0.1.0`，上传会被 `skip-existing` 静默跳过，接着
# `verify` 从 TestPyPI 装下来的是**上一次上传的那个旧包**，然后绿着通过——你以为修好了，
# 其实一行新代码都没验到。`.devN` 是 PEP 440 的合法预发布号，既不撞已存在的版本，也不烧掉
# 任何正式版本号。
#
# ⚠️ **推了修复之后要「新建一次 run」，不要点 Re-run**。这一条已经害人空转过一轮：
# GitHub 的 re-run 保留原 run 的 commit SHA 与 run number，按定义就是**重测那个旧 commit**；
# 「Re-run failed jobs」更狠——`build` 不重跑，`verify` 直接复用上一次的 artifact（旧 wheel）。
# 所以 dev 版本号用的是 **epoch 秒**而不是 `github.run_number`：后者在 re-run 时不变，于是
# 上传被 `skip-existing` 跳过、装回旧包，症状与「修复没生效」一模一样。时间戳让每次构建都
# 产出一个新版本号，即使误点 re-run 也会真的重新上传（虽然装到的仍是旧 commit 的代码——
# 那就是 re-run 的语义，只能靠下面打印的 SHA 认出来）。
#
# 顺序也是刻意的：先 TestPyPI 真装一次再发 PyPI。`pyproject.toml` 写对但 entry point 没
# 生效这类错，只有真装一次才看得见——而 PyPI 的版本号不可重用，发错就烧掉一个号。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # 仓库自己的测试，**排在上传之前**。
  #
  # 这一层是补上来的：`describe()` 里一个包属性遮蔽的 bug（`from . import case` 拿到的是
  # 装饰器函数而不是模块）一路走到了 TestPyPI 校验才炸——因为当时唯一的自动化是「装完之后
  # 验行为」，而缺陷在装之前就存在。上传前先跑一遍源码树的测试，同类问题在 30 秒内就能暴露，
  # 且不消耗任何 TestPyPI 版本号。
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # requests 是可选的：`test_plugin_session.py` 里验「stream 不被吃」的那条需要它，
      # 装上才不会被 skip 掉——那条恰好是最重要的行为保证之一。
      - run: pip install pytest requests
      - run: python -m pytest tests -q

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Decide the version to publish
        id: version
        # tag 路径要求 tag 与 `pyproject.toml` 逐字一致，**在构建之前**就查（fail fast）。
        # 不查的话，打 `v0.2.0` 但忘了改 pyproject 会走完整个 TestPyPI 上传，然后在
        # `verify` 里花 100 秒重试一个永远装不到的版本才失败——而失败信息指向索引延迟，
        # 完全看不出真实原因。
        #
        # 调试路径的后缀用 **epoch 秒**而不是 `github.run_number`：后者在 re-run 时不变，于是
        # 上传被 `skip-existing` 跳过、`verify` 装回旧包，症状与「修复没生效」一模一样（已经
        # 空转过一轮）。时间戳保证每次构建都产出一个未被占用的版本号。
        run: |
          MAIN=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          case "$GITHUB_REF" in
            refs/tags/v*)
              TAG="${GITHUB_REF_NAME#v}"
              if [ "$TAG" != "$MAIN" ]; then
                echo "::error::tag $TAG != pyproject version $MAIN"
                exit 1
              fi
              VERSION="$MAIN"
              IS_RELEASE=true
              ;;
            *)
              VERSION="${MAIN}.dev$(date -u +%s)"
              IS_RELEASE=false
              ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"
          # 这三行是「我到底在测哪一版代码」的唯一答案，必须打在最前面。
          # 之前要翻到 traceback 里读行号才能发现跑的是旧 commit，那时已经浪费了一整轮。
          # `git log -1` 打出提交标题：SHA 认人靠机器，标题认人靠眼睛。
          {
            echo "### 本次构建"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 版本号 | \`$VERSION\` |"
            echo "| 正式发布 | $IS_RELEASE |"
            echo "| commit | \`$GITHUB_SHA\` |"
            echo "| 提交标题 | $(git log -1 --pretty=%s) |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "=========================================================="
          echo " version : $VERSION  (release=$IS_RELEASE)"
          echo " commit  : $GITHUB_SHA"
          echo " subject : $(git log -1 --pretty=%s)"
          echo "=========================================================="

      - name: Rewrite the version for a debug run
        # 调试路径**就地重写 pyproject.toml**：改工作树而不是传 `--version` 之类的参数，
        # 是因为 hatchling 的版本来源就是这个文件，没有构建期覆盖的入口。改动只存在于这次
        # runner 的工作副本里，不会被推回仓库。
        #
        # 正则锚在行首的 `version = "` 上（文件里没有第二处同形的行），并要求恰好替换一处
        # ——替换到 0 处或 2 处都说明文件结构变了，那时宁可让流水线停下来。
        if: steps.version.outputs.is_release != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python -c "
          import os, pathlib, re
          target = os.environ['VERSION']
          path = pathlib.Path('pyproject.toml')
          patched, count = re.subn(r'(?m)^version = \"[^\"]+\"$', f'version = \"{target}\"', path.read_text(), count=1)
          assert count == 1, f'expected exactly one version line, patched {count}'
          path.write_text(patched)
          print(f'pyproject version -> {target}')
          "

      - run: pip install build
      - run: python -m build --outdir dist .
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          # 同一个 tag 重跑（`verify` 失败后重试是常态）时，TestPyPI 会因版本号重复整个
          # 拒绝上传——而这次上传本身没有任何问题。跳过已存在的版本让重试变成可行的动作。
          # 调试路径的 `.dev<epoch>` 本来就不会重复，这个参数只服务于 tag 重跑。
          #
          # 注意它与「装到旧包」那个坑的关系：`skip-existing` 会**静默**跳过，所以版本号一旦
          # 复用，后面的 `verify` 就会装回旧包并绿着通过。dev 版用时间戳正是为了让这两件事
          # 不可能同时发生。
          # **真 PyPI 那一步刻意不加这个参数**：那里版本号重复必须硬失败。
          skip-existing: true

  verify:
    needs: [build, testpypi]
    runs-on: ubuntu-latest
    strategy:
      # 三档而不是一档：`requires-python = ">=3.9"` 声明的下界必须真的被执行过，否则它只是
      # 一句话——某天有人把 `X | Y` 写在非注解位置，3.11 的 CI 全绿而 3.9 的用户装上就
      # TypeError。3.9 是下界、3.13 是当前上界，中间取 3.11 作代表。
      # `fail-fast: false` 让三档都跑完：只有 3.9 挂时要能一眼看出「是下界的问题」，而不是
      # 在一片红里猜。
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Announce what is being verified
        # 「我到底在测哪一版」必须在 verify 的日志开头就能读到。上一轮的教训：装到的是旧包，
        # 而唯一的线索是 traceback 里的行号对不上——那时已经浪费了一整轮。
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          echo "=========================================================="
          echo " verifying apitrack-sdk==$VERSION  on Python ${{ matrix.python-version }}"
          echo " from commit $GITHUB_SHA"
          echo " ⚠️ 若这个版本号不是刚构建出来的，说明这是一次 re-run（保留旧 commit）。"
          echo "    推了修复之后要新建 run，不要点 Re-run。"
          echo "=========================================================="

      - name: Install exactly this build from TestPyPI into a clean venv
        # **钉死本次的版本号**，不装「TestPyPI 上最新的」：后者可能是上一次上传的包，于是
        # 这一步会绿着通过而完全没验到本次改动（这也是调试路径要用 `.devN` 的同一条理由）。
        #
        # `--extra-index-url` 指向真 PyPI：pytest 只在 TestPyPI 上未必有可用版本。
        # `--pre` 是 dev 版必需的：pip 默认跳过预发布版本，不加它会报「找不到该版本」。
        # TestPyPI 的索引有几十秒传播延迟，刚上传就装会撞 404，所以带重试。
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python -m venv /tmp/verify
          echo "installing apitrack-sdk==$VERSION"
          for attempt in 1 2 3 4 5; do
            if /tmp/verify/bin/pip install --pre \
                 --index-url https://test.pypi.org/simple/ \
                 --extra-index-url https://pypi.org/simple/ \
                 "apitrack-sdk==$VERSION" pytest; then
              exit 0
            fi
            echo "attempt $attempt failed, waiting for the TestPyPI index"
            sleep 20
          done
          exit 1

      - name: The plugin must load without conftest.py or -p
        # 这一步是整个流水线存在的理由（验收 13）：`pyproject.toml` 写对但 entry point 没
        # 生效时，包能装上、也能 import，唯一的症状是「跑完什么都没上报」。
        #
        # 判据不看 `--trace-config` 的输出文本：那段文本里本来就有安装路径
        # `.../site-packages/apitrack/plugin.py`，`grep apitrack` 会被它蒙过去；而换个 pytest
        # 版本措辞一变又会假阴性。改成两条**行为**判据，它们只有在插件真被加载时才成立：
        #
        #   ① `--apitrack-dry-run` 出现在 `--help` 里 → `pytest_addoption` 跑过了，
        #      也就是 entry point 被 pytest 发现并加载了（不靠 conftest、不靠 -p）；
        #   ② dry-run 真的打出那行标记 → `pytest_configure` 与 `pytest_sessionfinish`
        #      也都跑到了，即整条插件生命周期完整。
        #
        # 探针测试必须真能被收集到：`--collect-only` / 空目录会让 pytest 返回退出码 5
        # （EXIT_NOTESTSCOLLECTED），那会在包完全正常的情况下把这一步弄红。
        run: |
          mkdir -p /tmp/probe
          printf 'def test_probe():\n    """探针用例。"""\n    assert True\n' > /tmp/probe/test_probe.py
          cd /tmp/probe
          # 诊断用，不作为判据：装到哪、加载了哪些插件，失败时要能一眼看到。
          /tmp/verify/bin/pytest --trace-config --collect-only || true
          /tmp/verify/bin/pytest --help | grep -q -- '--apitrack-dry-run'
          /tmp/verify/bin/pytest --apitrack-dry-run > /tmp/dry.log 2>&1
          cat /tmp/dry.log
          grep -q '\[apitrack\] dry run' /tmp/dry.log
          # dry-run 的 payload 里必须有那条探针用例，且 name 取自 docstring 首行
          # （边界 7 的映射规则）——只看到「插件加载了」还不能说明采集是对的。
          grep -q '"name": "探针用例。"' /tmp/dry.log

      - name: It must not require httpx
        # 只装了 requests 的环境（甚至两个都没装）必须能正常 import：两个 HTTP 库都靠
        # find_spec 探测，探不到就不打那个桩。
        run: /tmp/verify/bin/python -c "import apitrack, apitrack.plugin; print(apitrack.__version__)"

  pypi:
    needs: [build, verify]
    # 只有 tag 推送才发真 PyPI（`workflow_dispatch` 的调试跑到 `verify` 就停）。
    # 建议在 GitHub 的 `pypi` environment 上再加一个 required reviewer：那是最后一道人工
    # 闸门，即使误打了 tag 也会停下来等确认。那只能在网页上配。
    if: needs.build.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
