[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "apitrack-sdk"
version = "0.1.0"
description = "Report existing pytest results to an ApiTrack platform without changing a line of test code."
readme = "README.md"
# 下界 3.9 是刻意的：接入方常常正是那些最不愿意动的老仓库，而「零改动接入」这条硬指标对
# 它们才最有价值。代价是每个模块都必须有 `from __future__ import annotations`
# （`str | None` 这类写法在 3.9 会在运行期炸），CI 的 verify matrix 里因此钉了一档 3.9。
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ApiTrack" }]
keywords = ["pytest", "api", "coverage", "test-reporting"]
classifiers = [
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  # 逐版本列出，PyPI 页面的「支持哪些 Python」就读这些行；只写 `:: 3` 的话包能装但页面上
  # 看不出下界。这份清单必须与 `requires-python` 和 CI 的 verify matrix 保持一致——三处
  # 各说一套时，声明的下界就成了一句没人执行的话。
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]

# 刻意为空（计划 7.4）：`requests` / `httpx` / `pytest` 全部不进 dependencies。
# 它们是用户已有的东西，声明依赖会在用户环境里触发一次不必要的版本解析，甚至升级掉他们
# 钉住的版本。两个 HTTP 库靠 importlib.util.find_spec 探测，探不到就不打那个桩；上报本身
# 用标准库 urllib，所以这个包真的零依赖。
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "requests>=2.25"]

[project.urls]
Homepage = "https://github.com/apitrack/apitrack-sdk-python"

# 插件靠这一行自动加载：不要 conftest.py、不要 -p 参数（边界 4 的硬指标）。
# 注册名是 `apitrack`，于是关掉它就是 `-p no:apitrack`。
[project.entry-points.pytest11]
apitrack = "apitrack.plugin"

[tool.hatch.build.targets.wheel]
packages = ["apitrack"]

[tool.hatch.build.targets.sdist]
include = ["apitrack", "tests", "README.md", "LICENSE", "pyproject.toml"]
