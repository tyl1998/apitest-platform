services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: apitest
      POSTGRES_PASSWORD: apitest
      POSTGRES_DB: apitest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apitest -d apitest"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # 开 AOF：队列是「已受理但还没跑」的唯一凭据，默认的 RDB 快照会在硬重启时
    # 丢掉最后几秒入队的 job，让库里那行记录永远停在排队中。
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
